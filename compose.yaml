services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_PASSWORD: ledgerly
      POSTGRES_USER: ledgerly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ledgerly-postgres:/var/lib/postgresql/data

volumes:
  ledgerly-postgres:
